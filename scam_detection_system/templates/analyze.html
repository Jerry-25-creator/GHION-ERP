{% extends "base.html" %}
{% block title %}Analyze a Message - Scam Detection System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="h3 mb-2">Analyze a Message</h1>
        <p class="text-muted mb-4">
            Paste or type the message below. Do not include passwords, PINs or other private
            details you do not want stored.
        </p>

        <form id="analyze-form" novalidate>
            <label for="message" class="form-label fw-semibold">Message text</label>
            <!-- data-max-length is read by script.js for the character counter -->
            <textarea id="message" name="message" class="form-control message-box"
                      rows="8" maxlength="{{ max_length }}" data-max-length="{{ max_length }}"
                      placeholder="e.g. Congratulations! You have won a prize. Click the link to claim..."
                      required></textarea>

            <div class="d-flex justify-content-between align-items-center mt-2">
                <div id="form-feedback" class="small text-danger" role="alert" aria-live="polite"></div>
                <div class="small text-muted">
                    <span id="char-count">0</span> / {{ max_length }} characters
                </div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" id="analyze-btn" class="btn btn-primary px-4">Analyze Message</button>
                <button type="button" id="clear-btn" class="btn btn-outline-secondary">Clear</button>
            </div>
        </form>

        <!-- The result is inserted here by script.js -->
        <div id="result" class="mt-4" aria-live="polite"></div>
    </div>
</div>
{% endblock %}
